name: Build WEX Armoury APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and Fix Project
        run: |
          unzip -o "*.zip" -d project_src
          DIR=$(dirname "$(find project_src -name "settings.gradle" | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          find "$DIR" -name "build.gradle*" -exec sed -i 's/compileSdk[ =]*3[0-3]/compileSdk 34/g; s/compileSdkVersion[ =]*3[0-3]/compileSdkVersion 34/g' {} +
          find "$DIR" -name "*.java" -exec sed -i 's/ServiceInfo\.FOREGROUND_SERVICE_TYPE_SPECIAL_USE/1073741824/g' {} +
          python3 - << 'EOF'
          import glob
          def odd_q(s):
              t = s.replace("'\"'", "").replace('\\"', "")
              return t.count('"') % 2 == 1
          for p in glob.glob("project_src/**/*.java", recursive=True):
              lines = open(p, encoding="utf-8", errors="ignore").read().splitlines()
              out, i = [], 0
              while i < len(lines):
                  buf = lines[i]
                  i += 1
                  while odd_q(buf) and i < len(lines):
                      nxt = lines[i].lstrip()
                      i += 1
                      sep = "X" if (buf.endswith('"') and nxt.startswith('"')) else " "
                      buf = buf + sep + nxt
                  out.append(buf)
              txt = "\n".join(out) + "\n"
              d = txt.count("{") - txt.count("}")
              if d > 0:
                  txt += "}\n" * d
              open(p, "w", encoding="utf-8").write(txt)
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || { echo "=== EXACT ERRORS ==="; grep -n -C 3 "error:" build.log | tail -n 30; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WexArmoury-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
