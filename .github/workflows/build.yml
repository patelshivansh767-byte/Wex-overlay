name: Build WEX Armoury APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and Auto-Fix Project
        run: |
          unzip -o "*.zip" -d project_src
          DIR=$(dirname "$(find project_src -name "settings.gradle" | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          python3 - << 'EOF'
          import glob, re

          for path in glob.glob("project_src/**/*.java", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  s = f.read()
              s = re.sub(r'closeBtn\.setText\("[^"\n]*closeBtn\.setTextColor', 'closeBtn.setText("X");\n        closeBtn.setTextColor', s)
              diff = s.count("{") - s.count("}")
              if diff > 0:
                  s += "\n" + ("}\n" * diff)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)

          for path in glob.glob("project_src/**/index.html", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  h = f.read()
              h = re.sub(r"t\.batteryTempC \+ '[^';\n]*", "t.batteryTempC + ' C';\n      ", h)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(h)
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WexArmoury-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
