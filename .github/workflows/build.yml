name: Build WEX Armoury APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and Prepare Project
        run: |
          unzip -o "*.zip" -d project_src
          DIR=$(dirname "$(find project_src -name "settings.gradle*" | head -n 1)")
          export PROJECT_DIR="$DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          python3 - << 'EOF'
          import glob, os

          root = os.environ["PROJECT_DIR"]

          open(os.path.join(root, "settings.gradle"), "w").write("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WexArmoury"
          include ':app'
          """)

          open(os.path.join(root, "build.gradle"), "w").write("""plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          """)

          open(os.path.join(root, "app", "build.gradle"), "w").write("""plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.wex.armoury'
              compileSdk 34
              defaultConfig {
                  applicationId "com.wex.armoury"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """)

          manifest_path = os.path.join(root, "app", "src", "main", "AndroidManifest.xml")
          if os.path.exists(manifest_path):
              m = open(manifest_path, encoding="utf-8", errors="ignore").read()
              m = m.replace('package="com.wex.armoury"', '')
              open(manifest_path, "w", encoding="utf-8").write(m)

          for j in glob.glob(os.path.join(root, "**/*.java"), recursive=True):
              t = open(j, encoding="utf-8", errors="ignore").read()
              t = t.replace(
                  'return "{"freeRamMb":1850,"totalRamMb":4096,"batteryTempC":33.5,"batteryLevel":85,"freeStorageGb":42.5,"totalStorageGb":64.0,"dndActive":false,"overlayActive":false}";',
                  'return "{\\"freeRamMb\\":1850,\\"totalRamMb\\":4096,\\"batteryTempC\\":33.5,\\"batteryLevel\\":85,\\"freeStorageGb\\":42.5,\\"totalStorageGb\\":64.0,\\"dndActive\\":false,\\"overlayActive\\":false}";'
              )
              if "FloatingOverlayService" in j:
                  t = t.replace(
                      "private Button btnDaemonLock;",
                      "private Button btnDaemonLock;\n    private Button btnToggleReticle;"
                  )
                  t = t.replace(
                      'if (obj.has("offsetY")) crosshairOffsetY = obj.getInt("offsetY");',
                      'if (obj.has("offsetY")) crosshairOffsetY = obj.getInt("offsetY");\n            if (obj.has("enabled") && crosshairView != null) {\n                boolean en = obj.getBoolean("enabled");\n                crosshairView.setVisibility(en ? View.VISIBLE : View.GONE);\n                if (btnToggleReticle != null) {\n                    btnToggleReticle.setText(en ? "RETICLE: ON" : "RETICLE: OFF");\n                    btnToggleReticle.setTextColor(Color.parseColor(en ? "#00E5FF" : "#A0ABC0"));\n                }\n            }'
                  )
                  t = t.replace(
                      '.setOngoing(true)',
                      '.setOngoing(true).addAction(android.R.drawable.ic_menu_close_clear_cancel, "STOP OVERLAY", PendingIntent.getService(this, 1, new Intent(this, FloatingOverlayService.class).setAction(ACTION_STOP_OVERLAY), PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0)))'
                  )
                  controls_code = """hudLayout.addView(nudgeRow);
                  LinearLayout powerRow = new LinearLayout(this);
                  powerRow.setOrientation(LinearLayout.HORIZONTAL);
                  powerRow.setPadding(0, dpToPx(8), 0, 0);
                  btnToggleReticle = new Button(this);
                  btnToggleReticle.setText("RETICLE: ON");
                  styleActionButton(btnToggleReticle, "#0E222E", Color.parseColor("#00E5FF"));
                  LinearLayout.LayoutParams rLp = new LinearLayout.LayoutParams(0, dpToPx(36), 1f);
                  rLp.setMarginEnd(dpToPx(4));
                  btnToggleReticle.setLayoutParams(rLp);
                  btnToggleReticle.setOnClickListener(v -> {
                      if (crosshairView != null) {
                          boolean vis = crosshairView.getVisibility() == View.VISIBLE;
                          crosshairView.setVisibility(vis ? View.GONE : View.VISIBLE);
                          btnToggleReticle.setText(vis ? "RETICLE: OFF" : "RETICLE: ON");
                          btnToggleReticle.setTextColor(Color.parseColor(vis ? "#A0ABC0" : "#00E5FF"));
                          Toast.makeText(FloatingOverlayService.this, vis ? "Crosshair OFF" : "Crosshair ON", Toast.LENGTH_SHORT).show();
                      }
                  });
                  powerRow.addView(btnToggleReticle);
                  Button btnStopAll = new Button(this);
                  btnStopAll.setText("STOP OVERLAY");
                  styleActionButton(btnStopAll, "#3B0D14", Color.parseColor("#FF2A3C"));
                  LinearLayout.LayoutParams stopLp = new LinearLayout.LayoutParams(0, dpToPx(36), 1f);
                  stopLp.setMarginStart(dpToPx(4));
                  btnStopAll.setLayoutParams(stopLp);
                  btnStopAll.setOnClickListener(v -> {
                      Toast.makeText(FloatingOverlayService.this, "Overlay Stopped", Toast.LENGTH_SHORT).show();
                      stopSelf();
                  });
                  powerRow.addView(btnStopAll);
                  hudLayout.addView(powerRow);"""
                  t = t.replace("hudLayout.addView(nudgeRow);", controls_code)
              diff = t.count("{") - t.count("}")
              if diff > 0:
                  t += "\n" + "}\n" * diff
              open(j, "w", encoding="utf-8").write(t)

          for h in glob.glob(os.path.join(root, "**/*.html"), recursive=True):
              html = open(h, encoding="utf-8", errors="ignore").read()
              ch_row = """    <div class="switch-row">
                <div class="switch-info">
                  <div class="switch-title">Floating Crosshair Layer</div>
                  <div class="switch-desc">Turn center aim reticle ON or OFF while HUD pill stays active</div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="switchCrosshair" checked onchange="onToggleCrosshair(this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="switch-row" style="border-bottom:none;">"""
              html = html.replace('<div class="switch-row" style="border-bottom:none;">', ch_row)
              html = html.replace("offsetY: 0\n    };", "offsetY: 0,\n      enabled: true\n    };")
              ch_fn = """    function onToggleCrosshair(enabled) {
                crosshairConfig.enabled = enabled;
                var overlaySwitch = document.getElementById("switchOverlay");
                if (overlaySwitch && overlaySwitch.checked) {
                  try { bridge.updateCrosshairConfig(JSON.stringify(crosshairConfig)); } catch (err) {}
                }
              }
              function onToggleOverlay(enabled) {"""
              html = html.replace("function onToggleOverlay(enabled) {", ch_fn)
              html = html.replace(
                  'var switchEl = document.getElementById("switchOverlay");',
                  'window._lastOvToggle = Date.now(); var switchEl = document.getElementById("switchOverlay");'
              )
              html = html.replace(
                  'dndSwitch.checked = !!data.dndActive;\n          }',
                  'dndSwitch.checked = !!data.dndActive;\n          }\n          var ovSwitch = document.getElementById("switchOverlay");\n          if (ovSwitch && (!window._lastOvToggle || Date.now() - window._lastOvToggle > 2500)) { ovSwitch.checked = !!data.overlayActive; }'
              )
              open(h, "w", encoding="utf-8").write(html)
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WexArmoury-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
