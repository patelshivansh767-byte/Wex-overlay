name: Build WEX Armoury APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and Fix Project
        run: |
          unzip -o "*.zip" -d project_src
          DIR=$(dirname "$(find project_src -name "settings.gradle" | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          find "$DIR" -name "build.gradle*" -exec sed -i 's/compileSdk[ =]*3[0-3]/compileSdk 34/g; s/compileSdkVersion[ =]*3[0-3]/compileSdkVersion 34/g' {} +
          find "$DIR" -name "*.java" -exec sed -i 's/ServiceInfo\.FOREGROUND_SERVICE_TYPE_SPECIAL_USE/1073741824/g' {} +
          python3 - << 'EOF'
          import glob
          for p in glob.glob("project_src/**/*.java", recursive=True):
              out = []
              for line in open(p, encoding="utf-8", errors="ignore"):
                  clean = line.replace("'\"'", "")
                  q = clean.count('"') - clean.count('\\"')
                  if q % 2 == 1:
                      s = line.rstrip()
                      if "Toast.makeText" in s and "LENGTH_" not in s:
                          line = '        Toast.makeText(getApplicationContext(), "WEX Active", Toast.LENGTH_SHORT).show();\n'
                      elif s.endswith(";"):
                          line = s[:-1] + '");\n'
                      elif s.endswith(")"):
                          line = s[:-1] + '");\n'
                      else:
                          line = s + 'X");\n'
                  out.append(line)
              txt = "".join(out)
              d = txt.count("{") - txt.count("}")
              if d > 0:
                  txt += "\n" + ("}\n" * d)
              open(p, "w", encoding="utf-8").write(txt)
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || { echo "=== EXACT ERRORS ==="; grep -n -C 3 "error:" build.log | tail -n 30; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WexArmoury-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
