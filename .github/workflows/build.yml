name: Build WEX Armoury APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and Auto-Fix Project
        run: |
          unzip -o "*.zip" -d project_src
          DIR=$(dirname "$(find project_src -name "settings.gradle" | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          python3 -c '
          import glob, re
          for p in glob.glob("project_src/**/*.java", recursive=True):
              s = open(p, encoding="utf-8", errors="ignore").read()
              s = re.sub(r"closeBtn\.setText\(\"[\s\S]*?closeBtn\.setTextColor", "closeBtn.setText(\"X\");\n        closeBtn.setTextColor", s)
              d = s.count("{") - s.count("}")
              if d > 0:
                  s += "\n" + ("}\n" * d)
              open(p, "w", encoding="utf-8").write(s)
          for p in glob.glob("project_src/**/index.html", recursive=True):
              h = open(p, encoding="utf-8", errors="ignore").read()
              h = re.sub(r"t\.batteryTempC \+ \x27[\s\S]*?document\.getElementById\(", "t.batteryTempC + \x27 C\x27;\n      document.getElementById(", h)
              h = re.sub(r"t\.batteryTempC \+ \x27[\s\S]*?const tempPercent", "t.batteryTempC + \x27 C\x27;\n        const tempPercent", h)
              open(p, "w", encoding="utf-8").write(h)
          '

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WexArmoury-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
